[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physarum"
version = "0.1.0"
description = "Ein ERP, das aus den Daten einer Firma wächst."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dokumente = ["pdfplumber>=0.10", "python-docx>=1.1", "beautifulsoup4>=4.12"]
beispiel = ["reportlab>=4.0"]

[project.scripts]
physarum = "physarum.__main__:main"

[tool.setuptools.packages.find]
include = ["physarum*"]

[tool.setuptools.package-data]
physarum = ["web/templates/*.html", "web/static/*"]
